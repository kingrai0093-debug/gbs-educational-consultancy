  </head>
  <body className="antialiased text-slate-900 bg-white selection:bg-red-600 selection:text-white">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <audio id="startupAudio" src="/voice1.mpeg" autoplay preload="auto"></audio>
    <script>
      const bgAudio = document.getElementById('startupAudio');
      bgAudio.volume = 1.0; // Auto full volume

      const validGestures = ['click', 'mousedown', 'keydown', 'touchstart', 'pointerdown'];

      const forcePlay = () => {
        const promise = bgAudio.play();
        if (promise !== undefined) {
          promise.catch(e => {
            console.warn("Browser blocked autoplay. Waiting for valid user gesture...");
            
            const startOnInteract = () => {
              const playAttempt = bgAudio.play();
              if (playAttempt !== undefined) {
                playAttempt.then(() => {
                  // Only remove listeners if play actually succeeded
                  validGestures.forEach(evt => document.removeEventListener(evt, startOnInteract));
                }).catch(err => {
                  console.warn("Gesture ignored by browser, trying again on next gesture...");
                });
              }
            };
            
            validGestures.forEach(evt => {
              document.addEventListener(evt, startOnInteract);
            });
          });
        }
      };
      
      window.addEventListener('DOMContentLoaded', forcePlay);
      forcePlay();
    </script>
  </body>
</html>
