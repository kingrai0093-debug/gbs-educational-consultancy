name: Build Android APK

on:
  push:
    branches: ["main"]
    paths:
      - "android/**"
      - "public/**"
      - "src/**"
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Generate icons from logo
        run: |
          pip install Pillow
          python3 << 'EOF'
          from PIL import Image, ImageDraw
          import os

          src = 'public/gbs-logo.jpeg'
          img = Image.open(src).convert('RGBA')
          w, h = img.size
          size = max(w, h)
          bg = Image.new('RGBA', (size, size), (255, 255, 255, 255))
          x = (size - w) // 2
          y = (size - h) // 2
          bg.paste(img, (x, y), img)
          img = bg

          sizes = {
              'mipmap-mdpi': 48,
              'mipmap-hdpi': 72,
              'mipmap-xhdpi': 96,
              'mipmap-xxhdpi': 144,
              'mipmap-xxxhdpi': 192,
          }

          res_dir = 'android/app/src/main/res'
          for folder, px in sizes.items():
              out_dir = os.path.join(res_dir, folder)
              os.makedirs(out_dir, exist_ok=True)
              resized = img.resize((px, px), Image.LANCZOS)
              resized.save(os.path.join(out_dir, 'ic_launcher.png'), 'PNG')
              round_img = Image.new('RGBA', (px, px), (0, 0, 0, 0))
              mask = Image.new('L', (px, px), 0)
              draw = ImageDraw.Draw(mask)
              draw.ellipse((0, 0, px-1, px-1), fill=255)
              round_img.paste(resized, (0, 0), mask)
              round_img.save(os.path.join(out_dir, 'ic_launcher_round.png'), 'PNG')

          splash = img.resize((400, 400), Image.LANCZOS)
          splash.save(os.path.join(res_dir, 'drawable', 'app_logo.png'), 'PNG')
          print('Icons generated!')
          EOF

      - name: Grant execute permission for gradlew
        run: chmod +x android/gradlew

      - name: Build Debug APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Build Release APK
        working-directory: android
        run: ./gradlew assembleRelease

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: gbs-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: gbs-release-apk
          path: android/app/build/outputs/apk/release/app-release-unsigned.apk
          retention-days: 30
