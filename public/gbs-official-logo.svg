<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 380" width="100%" height="100%">
  <defs>
    <linearGradient id="crescentGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0F4C8A" />
      <stop offset="40%" stop-color="#1A68BA" />
      <stop offset="60%" stop-color="#DE1B2A" />
      <stop offset="100%" stop-color="#B71422" />
    </linearGradient>
    <filter id="subtleShadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.08" />
    </filter>
  </defs>

  <!-- Left Dynamic Crescent Orbit Swoosh -->
  <path d="M 160 30 C 70 50 40 120 52 195 C 60 245 92 285 140 305 C 85 280 68 235 64 195 C 56 125 95 62 160 30 Z" fill="url(#crescentGrad)" />
  
  <!-- Left Crescent Arrow Tip Accent -->
  <path d="M 46 195 L 60 210 L 58 190 Z" fill="#DE1B2A" />

  <!-- Airplane Contrail from 'S' to Plane -->
  <path d="M 375 140 C 400 125 415 95 425 60" stroke="#481F78" stroke-width="8" stroke-linecap="round" fill="none" />

  <!-- Flying Airplane Silhouette -->
  <g transform="translate(425, 48) rotate(42)">
    <!-- Fuselage & Wings -->
    <path d="M 0 -24 C 2 -24 5 -18 5 -6 L 28 -2 C 30 0 30 4 27 5 L 6 3 L 7 16 L 16 19 C 17 21 17 23 15 24 L 0 21 L -15 24 C -17 23 -17 21 -16 19 L -7 16 L -6 3 L -27 5 C -30 4 -30 0 -28 -2 L -5 -6 C -5 -18 -2 -24 0 -24 Z" fill="#481F78" />
  </g>

  <!-- Big Brand Letters: G B S -->
  <!-- G: Cobalt Blue -->
  <g fill="#0C4C91">
    <path d="M 195 72 C 160 72 135 98 135 138 C 135 178 160 204 196 204 C 228 204 248 186 250 156 L 195 156 L 195 130 L 278 130 C 280 185 245 230 196 230 C 142 230 106 192 106 138 C 106 84 142 46 196 46 C 235 46 265 68 274 100 L 244 110 C 238 88 218 72 195 72 Z" />
  </g>

  <!-- B: Ruby Crimson Red -->
  <g fill="#D21B2A">
    <path d="M 285 49 L 340 49 C 368 49 388 62 388 86 C 388 102 376 114 362 120 C 380 126 394 140 394 162 C 394 192 368 206 338 206 L 285 206 L 285 49 Z M 315 74 L 315 112 L 336 112 C 350 112 360 104 360 93 C 360 82 350 74 336 74 L 315 74 Z M 315 134 L 315 181 L 338 181 C 354 181 366 172 366 158 C 366 144 354 134 338 134 L 315 134 Z" />
  </g>

  <!-- S: Deep Royal Purple -->
  <g fill="#481F78">
    <path d="M 458 90 L 432 99 C 427 82 414 72 396 72 C 380 72 370 80 370 92 C 370 104 382 110 408 118 C 444 129 462 144 462 172 C 462 208 432 230 394 230 C 354 230 328 205 324 170 L 354 162 C 358 184 374 204 394 204 C 412 204 432 194 432 174 C 432 158 420 152 394 144 C 360 133 340 120 340 92 C 340 60 368 46 398 46 C 432 46 454 66 458 90 Z" />
  </g>

  <!-- Sharp Horizontal Divider Bar -->
  <line x1="116" y1="240" x2="445" y2="240" stroke="#16234F" stroke-width="2.5" />

  <!-- INTERNATIONAL with Globe 'O' -->
  <g fill="#16234F" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-weight="900" font-size="28" letter-spacing="4">
    <text x="120" y="274">INTERNATI</text>
    <text x="390" y="274">NAL</text>
  </g>

  <!-- Stylized Globe 'O' -->
  <g transform="translate(362, 263)">
    <!-- Outer Globe Circle -->
    <circle cx="0" cy="0" r="13" stroke="#0F4C8A" stroke-width="2.2" fill="none" />
    <!-- Equator Line -->
    <line x1="-13" y1="0" x2="13" y2="0" stroke="#DE1B2A" stroke-width="1.8" />
    <!-- Meridian Ellipse -->
    <ellipse cx="0" cy="0" rx="6" ry="13" stroke="#481F78" stroke-width="1.6" fill="none" />
    <line x1="0" y1="-13" x2="0" y2="13" stroke="#0F4C8A" stroke-width="1.2" />
  </g>

  <!-- — EDUCATIONAL CONSULTANCY — -->
  <g fill="#16234F" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-weight="800" font-size="14.5" letter-spacing="2.5">
    <text x="280" y="304" text-anchor="middle">— EDUCATIONAL CONSULTANCY —</text>
  </g>

  <!-- — Your destination, our guidance — -->
  <g fill="#16234F" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-weight="600" font-style="italic" font-size="13" letter-spacing="1">
    <text x="280" y="330" text-anchor="middle">— Your destination, our guidance —</text>
  </g>
</svg>
