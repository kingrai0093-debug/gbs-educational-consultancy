<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Creative Portfolio Template</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;500;700&display=swap');
        body { font-family: 'Space Grotesk', sans-serif; }
    </style>
</head>
<body class="bg-black text-white selection:bg-purple-500 selection:text-white">
    <!-- Navbar -->
    <nav class="p-6 flex justify-between items-center">
        <div class="text-2xl font-bold tracking-tighter">STUDIO<span class="text-purple-500">X</span></div>
        <div class="space-x-6 text-sm uppercase tracking-widest">
            <a href="#" class="hover:text-purple-400 transition">Work</a>
            <a href="#" class="hover:text-purple-400 transition">About</a>
            <a href="#" class="hover:text-purple-400 transition">Contact</a>
        </div>
    </nav>

    <!-- Hero -->
    <main class="min-h-[80vh] flex flex-col justify-center px-6 md:px-24">
        <h1 class="text-6xl md:text-9xl font-bold uppercase leading-none tracking-tighter mb-6">
            We build <br>
            <span class="text-transparent bg-clip-text bg-gradient-to-r from-purple-400 to-pink-600">Digital</span> <br>
            Experiences.
        </h1>
        <p class="text-xl md:text-2xl text-gray-400 max-w-2xl mb-12">
            An award-winning creative studio pushing the boundaries of web design, motion, and interaction.
        </p>
        <div>
            <a href="#" class="inline-block px-8 py-4 border border-white/20 rounded-full hover:bg-white hover:text-black transition duration-300 font-medium">
                View Our Work &rarr;
            </a>
        </div>
    </main>

    <!-- Gallery -->
    <section class="py-24 px-6 md:px-24 border-t border-white/10">
        <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
            <div class="group relative overflow-hidden rounded-xl bg-gray-900 aspect-video">
                <div class="absolute inset-0 bg-gradient-to-b from-transparent to-black/80 z-10 opacity-0 group-hover:opacity-100 transition duration-500 flex flex-col justify-end p-8">
                    <h2 class="text-2xl font-bold">Project Alpha</h2>
                    <p class="text-gray-300">Web Design / 3D</p>
                </div>
            </div>
            <div class="group relative overflow-hidden rounded-xl bg-gray-900 aspect-video md:mt-24">
                <div class="absolute inset-0 bg-gradient-to-b from-transparent to-black/80 z-10 opacity-0 group-hover:opacity-100 transition duration-500 flex flex-col justify-end p-8">
                    <h2 class="text-2xl font-bold">Project Beta</h2>
                    <p class="text-gray-300">Branding / Motion</p>
                </div>
            </div>
        </div>
    </section>

    <!-- Footer -->
    <footer class="p-6 md:px-24 py-12 flex justify-between items-center border-t border-white/10 text-gray-500 text-sm">
        <p>&copy; 2026 Studio X</p>
        <p>Crafted with pure code.</p>
    </footer>
</body>
</html>
